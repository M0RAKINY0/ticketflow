services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ventra
      POSTGRES_PASSWORD: ventra
      POSTGRES_DB: ventra_e2e
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventra -d ventra_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: ventra-e2e-redis
    ports:
      - "127.0.0.1:56379:6379"
    command: redis-server --appendonly no --maxmemory-policy noeviction
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
