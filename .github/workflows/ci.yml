name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ventra
          POSTGRES_PASSWORD: ventra
          POSTGRES_DB: ventra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventra -d ventra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgresql://ventra:ventra@localhost:5432/ventra
      TEST_DATABASE_URL: postgresql://ventra:ventra@localhost:5432/ventra_test
      ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-characters
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: re_ci_placeholder
      AUTH_EMAIL_FROM: Ventra <auth@example.com>

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply test database migrations
        run: npm run prisma:migrate:test

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
